{% extends 'base.html' %}{% block title %}Edit Flight{% endblock %}{% block page_heading %}Edit Flight{% endblock %}{% block content %}<section class="card form-card"><form method="post" class="form-grid"><label>Flight Number *<input name="flight_number" value="{{ flight.flight_number }}" required></label><label>Airline *<input name="airline" value="{{ flight.airline }}" required></label><label>Source *<input name="source" value="{{ flight.source }}" required></label><label>Destination *<input name="destination" value="{{ flight.destination }}" required></label><label>Departure *<input type="datetime-local" name="departure" value="{{ flight.departure }}" required></label><label>Arrival *<input type="datetime-local" name="arrival" value="{{ flight.arrival }}" required></label><label>Gate<input name="gate" value="{{ flight.gate }}"></label><label>Terminal<input name="terminal" value="{{ flight.terminal }}"></label><label>Status *<select name="status">{% for s in flight_statuses %}<option {% if s==flight.status %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><div class="form-actions"><button class="btn primary">Save Changes</button><a class="btn" href="{{ url_for('flights_page') }}">Cancel</a></div></form></section>{% endblock %}
