{% extends 'base.html' %}{% block title %}Edit Passenger{% endblock %}{% block page_heading %}Edit Passenger{% endblock %}{% block content %}<section class="card form-card"><form method="post" class="form-grid"><label>Passenger ID *<input type="number" name="passenger_id" value="{{ passenger.passenger_id }}" required></label><label>Name *<input name="name" value="{{ passenger.name }}" required></label><label>Flight *<select name="flight_number">{% for f in flights %}<option {% if f.flight_number==passenger.flight_number %}selected{% endif %}>{{ f.flight_number }}</option>{% endfor %}</select></label><label>Seat *<input name="seat_number" value="{{ passenger.seat_number }}" required></label><label>Boarding Group *<input type="number" min="1" max="5" name="boarding_group" value="{{ passenger.boarding_group }}" required></label><label>Priority *<input type="number" min="1" max="5" name="priority" value="{{ passenger.priority }}" required></label><label>Type *<select name="passenger_type">{% for x in passenger_types %}<option {% if x==passenger.passenger_type %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><label>Status *<select name="boarding_status">{% for x in boarding_statuses %}<option {% if x==passenger.boarding_status %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><div class="form-actions"><button class="btn primary">Save Changes</button><a class="btn" href="{{ url_for('passengers_page') }}">Cancel</a></div></form></section>{% endblock %}
